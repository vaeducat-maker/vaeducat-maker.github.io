function resize(){const rect=C.getBoundingClientRect();size.w=Math.max(100,rect.width);size.h=Math.max(120,rect.height);size.dpr=Math.min(2,window.devicePixelRatio||1);C.width=Math.round(size.w*size.dpr);C.height=Math.round(size.h*size.dpr);ctx.setTransform(size.dpr,0,0,size.dpr,0,0)}window.addEventListener('resize',resize);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(C);resize();
function rgba(hex,alpha){const s=hex.replace('#','');return `rgba(${parseInt(s.slice(0,2),16)},${parseInt(s.slice(2,4),16)},${parseInt(s.slice(4,6),16)},${alpha})`}
function circle(x,y,r,color,blur=0){ctx.save();if(blur){ctx.shadowColor=color;ctx.shadowBlur=blur}ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill();ctx.restore()}

function ellipse(x,y,rx,ry,color,lineWidth=1,rotation=0,glow=0){ctx.save();ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rotation,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.shadowBlur=glow;ctx.shadowColor=color;ctx.stroke();ctx.restore()}

function drawCrystal(x,y,s,c1,c2,flip=1){const y2=y-s;polygon([[x-s*.32,y],[x-s*.2,y-s*.78],[x,y2],[x+s*.3,y-s*.68],[x+s*.34,y]],rgba(c1,.16),rgba(c2,.85),1.3,10);polygon([[x,y2],[x-s*.2,y-s*.78],[x-s*.32,y],[x,y-s*.2]],rgba(c2,.35));line(x,y2,x,y-s*.2,rgba(c2,.8),1.3)}
function sceneArchitecture(w,h,t){const cfg=worlds[st.world],kind=cfg.kind,A=cfg.colors[2],B=cfg.colors[3];const R=rand(700+st.world*100),s=Math.min(w,h);
 if(kind==='star'){ // orbital structures

  drawCrystal(w*.17,h*.44,s*.16,A,B);drawCrystal(w*.39,h*.24,s*.12,B,A);}
 if(kind==='forest'){glow(w*.5,h*.8,w*.7,A,.12);for(let i=0;i<10;i++){const x=(i-.8)*w/8,hei=h*(.12+(i%4)*.05);line(x,h*.85,x,h*.85-hei,'#174649',5+i%3);for(let j=0;j<4;j++){const yy=h*.85-hei*.35-j*hei*.16;polygon([[x-23-j*3,yy+20],[x,yy-hei*.32],[x+23+j*3,yy+20]],rgba(i%2?B:A,.12),rgba(A,.16),.6)}}for(let i=0;i<7;i++){let x=R()*w,y=h*(.7+R()*.2);line(x,y,x,y-13,rgba(A,.3),2);ellipse(x,y-13,8,3,rgba(A,.7),2,0,7);circle(x,y-13,2,'#e9ffd3',5)}}
 if(kind==='crystal'){glow(w*.5,h*.82,w*.48,B,.16);for(let i=0;i<11;i++){let x=(i+.1)*w/10,yy=h*(.88+R()*.1);drawCrystal(x,yy,h*(.18+R()*.3),i%2?A:B,i%2?B:A)}for(let i=0;i<8;i++)line(i*w/8,h*.98,(i+1)*w/8,h*.98-h*.15,rgba(A,.1),1.5)}
 if(kind==='cloud'){const cy=h*.25;glow(w*.45,cy,w*.65,'#a5f5ff',.23);for(let i=0;i<10;i++){const x=R()*w,y=R()*h*.7;glow(x,y,15+R()*40,'#defcff',.11);ellipse(x,y,22+R()*37,10+R()*9,rgba('#d7f8ff',.15),1)}for(let i=0;i<6;i++){const x=(i+.4)*w/6,base=h*(.85+i%3*.04),yy=base-h*(.23+R()*.15);polygon([[x-23,base],[x-19,yy],[x+18,yy],[x+22,base]],rgba(B,.12),rgba(A,.3));line(x-24,yy,x+22,yy,rgba(A,.4),2);polygon([[x-30,yy],[x,yy-14],[x+26,yy]],rgba(B,.16),rgba('#f4feff',.3))}}
 if(kind==='sea'){for(let j=0;j<6;j++){ctx.beginPath();ctx.moveTo(-10,h*(.4+j*.095));for(let i=0;i<=w+20;i+=6)ctx.lineTo(i,h*(.4+j*.095)+Math.sin(i*.019+t*.45+j)*9);ctx.strokeStyle=rgba(j%2?B:A,.08);ctx.lineWidth=3;ctx.stroke()}for(let i=0;i<13;i++){const x=R()*w,y=R()*h;ellipse(x,y,3+R()*11,3+R()*11,rgba(A,.25),1)}for(let i=0;i<8;i++){let x=i*w/7;polygon([[x-18,h],[x-12,h*.8],[x,h*.65],[x+13,h*.82],[x+19,h]],rgba(i%2?A:B,.12),rgba(A,.2),1)}}
 if(kind==='lava'){glow(w*.52,h*.93,w*.65,A,.28);for(let i=0;i<11;i++){let x=i*w/10,base=h*(.84+R()*.12),peak=h*(.37+R()*.25);polygon([[x-35,h],[x-23,base],[x,peak],[x+17,base],[x+38,h]],rgba('#a94454',.19),rgba(A,.17),1);line(x,peak,x+6,base,rgba('#ffb06e',.16),1)}for(let i=0;i<14;i++){let x=R()*w,y=h*(.5+R()*.5);circle(x,y,1+R()*2,rgba('#ffc070',.65),6)}}
 if(kind==='clock'){for(let i=0;i<5;i++){const x=i*w/4,y=h*(.3+Math.sin(i)*.13),r=20+i%3*12;ellipse(x,y,r,r,rgba(A,.18),1.8);ellipse(x,y,r*.65,r*.65,rgba(B,.21),1);line(x,y,x+Math.sin(t*.2+i)*r*.5,y-Math.cos(t*.2+i)*r*.5,rgba(A,.38),2);line(x,y,x-Math.cos(t*.1+i)*r*.35,y-Math.sin(t*.1+i)*r*.35,rgba(B,.5),1)}for(let i=0;i<9;i++){const x=i*w/8,y=h*(.84+R()*.07),top=h*(.3+R()*.2);polygon([[x-12,y],[x-12,top],[x+12,top],[x+12,y]],rgba(B,.07),rgba(A,.17));ellipse(x,top,13,4,rgba(A,.24),1)}}
 if(kind==='space'){glow(w*.65,h*.28,w*.34,B,.28);circle(w*.78,h*.22,h*.09,rgba(B,.2));ellipse(w*.78,h*.22,h*.17,h*.045,rgba(A,.35),2,-.4,5);for(let i=0;i<7;i++)drawCrystal(R()*w,R()*h,h*(.06+R()*.07),A,B)}
 if(kind==='sun'){glow(w*.58,h*.35,w*.62,'#ffd88f',.28);const x=w*.56,y=h*.3,r=h*.13;for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.025;line(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5,x+Math.cos(a)*r*2.1,y+Math.sin(a)*r*2.1,rgba(A,.3),2,8)}circle(x,y,r,rgba(A,.12));for(let i=0;i<6;i++){const xx=i*w/5,yy=h*.82;polygon([[xx-18,yy],[xx-18,yy-50],[xx,yy-68],[xx+18,yy-50],[xx+18,yy]],rgba(B,.12),rgba(A,.25));line(xx-18,yy-50,xx+18,yy-50,rgba(A,.45),1)}}
 // Common small floating ornaments, deterministic per world, gently drifting

}
function drawPortal(w,h,t){
 const cfg=worlds[st.world],A=cfg.colors[2],B=cfg.colors[3];
 // Finish portal grows brighter as the runner completes the world's challenges.
 const energy=st.step/tasks.length,x=w*.79,y=h*.29,r=Math.min(w*.12,h*.17);
 glow(x,y,r*2.2,A,.11+energy*.15);
 ctx.save();ctx.translate(x,y);ctx.rotate(t*.17);for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,0,r*(.7+i*.18),r*(1.12+i*.16),0,i*.55,4.9+i*.25);ctx.strokeStyle=rgba(i%2?B:A,.35+energy*.4);ctx.lineWidth=2.3;ctx.shadowBlur=14;ctx.shadowColor=A;ctx.stroke()}ctx.restore();

}
// The playfield is a genuine endlessly scrolling arcade lane; answering correctly
// triggers a timed leap over the current obstacle. A wrong answer causes a crash.
function drawHazard(x,ground,scale,A,B,kind,t,opacity=1){
 ctx.save();ctx.globalAlpha=opacity;ctx.translate(x,ground);ctx.scale(scale,scale);
 if(kind===0){
  for(let i=-1;i<=1;i++){const xx=i*20;polygon([[xx-15,0],[xx,-39-(i===0?10:0)],[xx+15,0]],'#2a193d','#ffa6e1',2,13);polygon([[xx-7,-8],[xx,-28-(i===0?10:0)],[xx+6,-8]],rgba(B,.78))}
 }else if(kind===1){
  ctx.rotate(t*2.1);polygon(Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;const r=i%2?22:32;return [Math.cos(a)*r,Math.sin(a)*r]}),'#42234f',A,2,10);
  circle(0,0,11,'#f7fffe',12);circle(0,0,5,B,8);
 }else{
  polygon([[-24,0],[-24,-62],[24,-62],[24,0]],rgba(B,.14),A,3,13);
  for(let yy=-56;yy<=-7;yy+=12)line(-22,yy,22,yy,rgba('#ff9bba',.8),4,8);
  polygon([[-27,-64],[0,-76],[27,-64]],'#361b4e','#ffc9ef',2);
 }
 ctx.restore();
}
function drawEnergyTrack(w,h,t){
 const cfg=worlds[st.world],A=cfg.colors[2],B=cfg.colors[3];
 const ground=h*.78,heroX=w*.205,r=15;
 const speed=runner.speed;const offset=runner.distance;
 // Three truly scrolling layers form the sense of forward speed without roads or cars.
 for(let layer=0;layer<3;layer++){
   const y=h*(.56+layer*.065),gap=72-layer*9,shift=(offset*(.18+layer*.17))%gap;
   for(let i=-2;i<Math.ceil(w/gap)+3;i++){
     const x=i*gap-shift,yy=y+Math.sin((i+st.world)*.9)*8;
     polygon([[x-22,yy+7],[x-6,yy-4],[x+25,yy-4],[x+39,yy+7]],rgba(layer%2?B:A,.06+layer*.035),rgba(A,.16+layer*.05),1);
   }
 }
 const floor=ctx.createLinearGradient(0,ground,0,h);floor.addColorStop(0,rgba(A,.14));floor.addColorStop(1,rgba(B,.025));ctx.fillStyle=floor;ctx.fillRect(0,ground,w,h-ground);
 line(0,ground,w,ground,rgba(A,.85),3,12);line(0,ground+9,w,ground+9,rgba(B,.2),1);
 const tileGap=47;for(let i=-1;i<=w/tileGap+1;i++){
   const x=i*tileGap-(offset%tileGap);line(x,ground+12,x+24,h,rgba(A,.10),1.3);
   ctx.fillStyle=rgba(B,.045);ctx.fillRect(x+6,ground+18,22,4);
 }
 // Moving motes and streaks make the player visibly race even during calculation.
 for(let i=0;i<15;i++){
   const gap=w/11,x=((i*63-offset*(.34+i%4*.12))%(w+100)+(w+100))%(w+100)-35;
   const yy=h*(.35+(i*7%11)*.033);
   line(x,yy,x-17-(i%3)*12,yy,rgba(i%2?A:B,.11+i%3*.07),1.4,4);
 }
 // Main real obstacle approaches the runner as the answer deadline nears.
 const now=performance.now(),secsLeft=Math.max(0,(deadline-now)/1000);
 let hazardX=w*.79,alpha=1;
 if(runner.phase==='run'){
   const approach=clamp(1-secsLeft/3.15,0,1);
   hazardX=w*.86-(w*.86-(heroX+18))*approach;
   // World continues racing, while the major hazard stays in the foreground.
 }else if(runner.phase==='jump'){
   const p=clamp((now-runner.startedAt)/940,0,1);
   hazardX=w*.81-(w*.81+85)*p;
 }else if(runner.phase==='crash'){
   hazardX=heroX+18;
 }
 const kind=(st.step+st.world)%3;
 drawHazard(hazardX,ground,Math.min(1.0,h/320),A,B,kind,t,alpha);
 if(runner.phase==='run'&&secsLeft<4.5){
   ctx.fillStyle=rgba('#ffc8d0',.7);ctx.font='bold 11px system-ui';ctx.textAlign='right';ctx.fillText('⚠',Math.min(w-18,hazardX+5),ground-76);
 }
 // Small guardian sphere: strong legibility and an actual arcing jump trajectory.
 let jump=0,rotation=0;
 if(runner.phase==='jump'){
   const p=clamp((now-runner.startedAt)/940,0,1);
   jump=Math.sin(Math.PI*p)*Math.min(h*.30,115);rotation=2*Math.PI*p;
 }else if(runner.phase==='run'){
   // Tiny quick bounces give a clear running rhythm while awaiting the answer.
   jump=2+Math.max(0,Math.sin(t*7))*7;
   rotation=t*2.5;
 }
 const heroY=ground-r-jump;
 orbXPosition=heroX;orbYPosition=heroY;
 if(runner.phase==='crash'){
   glow(heroX,ground-r,69,'#ff4d82',.78);
   for(let i=0;i<15;i++){
     const a=i*Math.PI*2/15+t*.4,rr=10+clamp((now-runner.startedAt)/12,0,45);
     line(heroX,ground-r,heroX+Math.cos(a)*rr,ground-r+Math.sin(a)*rr,'#ff8eb6',2,11);
   }
   ctx.save();ctx.fillStyle='#fff1f4';ctx.font='900 19px system-ui';ctx.textAlign='center';ctx.shadowColor='#ff597e';ctx.shadowBlur=18;ctx.fillText('KOKKUPÕRGE!',w*.51,h*.38);ctx.restore();
   return;
 }
 for(let i=0;i<12;i++){
   const k=i/12;circle(heroX-12-k*80,heroY+Math.sin(i+t*14)*3,(1-k)*5,rgba(A,(1-k)*.4),8);
 }
 glow(heroX,heroY,50,A,.47);circle(heroX,heroY,18,rgba('#bafffc',.21),18);
 ctx.save();ctx.translate(heroX,heroY);ctx.rotate(rotation);
 polygon([[0,-17],[15,0],[0,17],[-15,0]],rgba(A,.82),'#efffff',2.5,15);
 polygon([[0,-11],[10,0],[0,11],[-10,0]],rgba('#ffffff',.52));
 ctx.restore();
 for(let i=0;i<4;i++){const angle=t*3+i*Math.PI/2;circle(heroX+Math.cos(angle)*24,heroY+Math.sin(angle)*21,2.1,rgba(B,.8),5)}
 if(runner.phase==='jump'){ctx.save();ctx.textAlign='center';ctx.font='900 14px system-ui';ctx.fillStyle='#a7ffec';ctx.shadowBlur=15;ctx.shadowColor=A;ctx.fillText('HÜPE!',heroX+5,Math.max(40,heroY-38));ctx.restore()}
}
let orbXPosition=0,orbYPosition=0;
function spawnBurst(type="good"){const cfg=worlds[st.world],R=rand(Math.round(performance.now()*13));for(let i=0;i<34;i++){const a=R()*Math.PI*2,s=1+R()*5;particles.push({x:orbXPosition,y:orbYPosition,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:type==="crash"?(i%2?"#ff5577":"#ffd3af"):(i%3?cfg.colors[2]:cfg.colors[3]),r:1+R()*3})}}

 // depth grid
 ctx.save();ctx.strokeStyle=rgba(A,.035);ctx.lineWidth=1;for(let i=0;i<16;i++){line(i*w/14,0,i*w/14,h,rgba(A,.035));line(0,i*h/12,w,i*h/12,rgba(A,.032))}ctx.restore();
 sceneArchitecture(w,h,tick);drawPortal(w,h,tick);drawEnergyTrack(w,h,tick);
 if(flash>0){flash=Math.max(0,flash-delta*2.2);ctx.fillStyle=rgba(A,flash*.14);ctx.fillRect(0,0,w,h)}
 if(mode&&deadline){deadline+=delta*1000}else if(!busy&&deadline){const seconds=Math.max(0,Math.ceil((deadline-now)/1000));if(seconds!==lastSecond){lastSecond=seconds;$('timer').textContent='◷ '+seconds+'s';$('timer').classList.toggle('low',seconds<=7)}if(now>deadline)timeExpired()}
 ctx.save();ctx.globalCompositeOperation='screen';particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*delta*45;p.y+=p.vy*delta*45;p.vy+=delta*2;p.life-=delta*1.45;circle(p.x,p.y,p.r*p.life,rgba(p.color,p.life),9)}ctx.restore();requestAnimationFrame(drawFrame)}
