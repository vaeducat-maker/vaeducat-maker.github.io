<body>
<main class="app">
<div class="brand">EDUKASS</div>
<header class="top"><div><h1>Kiire sõnatreener</h1><p class="sub">10 sõna ja väljendit · eesti keel</p></div><div class="top-tools"><button class="deck-button" id="reviewBtn" aria-label="Карточки" title="Карточки"><span class="deck-stack" aria-hidden="true"></span></button><div class="pill" id="pill">1 / 5 · Tutvu</div></div></header>
<div class="progress"><span id="p1" class="on"></span><span id="p2"></span><span id="p3"></span><span id="p4"></span><span id="p5"></span></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="actions"><button class="ghost" id="restart">↻ Alusta uuesti</button><div class="tiny" id="counter"></div></div>
</main>
<script>
(()=>{
const words=[
{et:"tee kokkuvõte",ru:"подведи итог",chunks:["tee ","kok","ku","võ","te"],fake:["la","mi"],img:0},
{et:"lugeja",ru:"читатель",chunks:["lu","ge","ja"],fake:["va","si"],img:1},
{et:"minu meelest",ru:"по-моему",chunks:["mi","nu ","mee","lest"],fake:["va","ta"],img:2},
{et:"mõnus",ru:"приятный",chunks:["mõ","nus"],fake:["ka","li"],img:3},
{et:"toovad vanemad",ru:"родители приносят",chunks:["too","vad ","va","ne","mad"],fake:["si","ku"],img:4},
{et:"soovitama",ru:"рекомендовать",chunks:["soo","vi","ta","ma"],fake:["le","ga"],img:5},
{et:"meelt lahutama",ru:"развлекаться",chunks:["meelt ","la","hu","ta","ma"],fake:["si","ko"],img:6},
{et:"paremini aru saama",ru:"лучше понимать",chunks:["pa","re","mi","ni ","a","ru ","saa","ma"],fake:["ve","lo"],img:7},
{et:"enamasti",ru:"в основном",chunks:["e","na","mas","ti"],fake:["lu","va"],img:8},
{et:"valima",ru:"выбирать",chunks:["va","li","ma"],fake:["ga","si"],img:9}
];
const card=document.getElementById("card"),pill=document.getElementById("pill"),counter=document.getElementById("counter"),progress=document.querySelector(".progress"),restart=document.getElementById("restart"),reviewBtn=document.getElementById("reviewBtn"),ps=[1,2,3,4,5].map(n=>document.getElementById("p"+n));
let stage=1,queue=[],index=0,locked=false,mastered=new Set(),mode="trainer",reviewQueue=[],reviewIndex=0,reviewGood=0,reviewBad=0,reviewFlipped=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLocaleLowerCase("et").trim().replace(/[.!?,;:]+$/g,"").replace(/\s+/g," ");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
const vis=s=>s.trim();
document.addEventListener("copy",e=>e.preventDefault());document.addEventListener("cut",e=>e.preventDefault());document.addEventListener("contextmenu",e=>e.preventDefault());
function chrome(){const names={1:"Tutvu",2:"Vali",3:"Koosta",4:"Koosta +",5:"Kirjuta"};pill.textContent=`${stage} / 5 · ${names[stage]}`;ps.forEach((p,i)=>p.classList.toggle("on",i<stage));counter.textContent=stage===1?`${Math.min(index+1,10)} / 10`:`${Math.min(mastered.size+1,10)} / 10`}
function start(n){mode="trainer";progress.hidden=false;restart.textContent="↻ Alusta uuesti";stage=n;queue=n===1?[...words]:shuffle(words);index=0;locked=false;mastered=new Set();chrome();render()}
function next(){index++;locked=false;if(index<queue.length){chrome();render();return}stage<5?start(stage+1):finish()}
function good(item,ms){if(stage>1)mastered.add(item.et);setTimeout(next,ms)}
function defer(item,ms){mastered.delete(item.et);if(index>=queue.length-1){const alt=shuffle(words.filter(w=>w.et!==item.et))[0];if(alt)queue.push(alt)}queue.push(item);setTimeout(()=>{index++;locked=false;chrome();render()},ms)}
function render(){const item=queue[index];if(stage===1)study(item);else if(stage===2)choice(item);else if(stage===3)build(item,false);else if(stage===4)build(item,true);else type(item)}
function study(item){card.innerHTML=`<div class="study-visual"><div class="mnemo m${item.img}" aria-hidden="true"></div></div><div class="prompt">${esc(item.et)}</div><div class="translation">${esc(item.ru)}</div><button class="primary" id="next">Edasi →</button>`;card.querySelector("#next").onclick=next}
function choice(item){const opts=shuffle([item,...shuffle(words.filter(w=>w.et!==item.et)).slice(0,3)]);card.innerHTML=`<div class="prompt">${esc(item.ru)}</div><div class="choices" id="choices"></div><div class="feedback" id="fb"></div>`;const box=card.querySelector("#choices");opts.forEach(o=>{const b=document.createElement("button");b.className="choice";b.textContent=o.et;b.onclick=()=>checkChoice(b,o.et===item.et,item,box);box.appendChild(b)})}
function checkChoice(btn,ok,item,box){if(locked)return;locked=true;[...box.children].forEach(b=>b.disabled=true);const fb=card.querySelector("#fb");if(ok){btn.classList.add("correct");fb.className="feedback ok";fb.textContent="✓ Õige!";good(item,850);return}btn.classList.add("wrong");const right=[...box.children].find(b=>b.textContent===item.et);if(right)right.classList.add("correct");fb.className="feedback bad";fb.innerHTML=`<strong style="color:#167047">${esc(item.et)}</strong>`;defer(item,2500)}
function panel(item){return `<div class="panel"><div class="panel-label">Õige vastus</div><div class="panel-bricks">${item.chunks.map(c=>`<span>${esc(vis(c))}</span>`).join("")}</div><div class="panel-word">${esc(item.et)}</div></div>`}
function build(item,fakes){const pieces=shuffle([...item.chunks.map((v,i)=>({id:"c"+i,v})),...(fakes?item.fake.map((v,i)=>({id:"f"+i,v})):[])]),selected=[];card.innerHTML=`<div class="prompt">${esc(item.ru)}</div><div class="build-zone" id="zone"><span class="placeholder">Собери здесь</span></div><div class="built" id="built"></div><div class="bank" id="bank"></div><div class="build-actions"><button class="secondary" id="clear">Очистить</button><button class="primary" id="check">Kontrolli</button></div><div class="feedback" id="fb"></div><div id="host"></div>`;const zone=card.querySelector("#zone"),bank=card.querySelector("#bank"),built=card.querySelector("#built"),check=card.querySelector("#check"),clear=card.querySelector("#clear");
function redraw(){zone.innerHTML="";if(!selected.length){zone.classList.remove("has");zone.innerHTML='<span class="placeholder">Собери здесь</span>'}else{zone.classList.add("has");selected.forEach(p=>{const b=document.createElement("button");b.className="brick";b.textContent=vis(p.v);b.onclick=()=>{if(locked)return;selected.splice(selected.findIndex(x=>x.id===p.id),1);const src=bank.querySelector(`[data-id="${p.id}"]`);if(src){src.disabled=false;src.classList.remove("used")}redraw()};zone.appendChild(b)})}built.textContent=selected.map(x=>x.v).join("").trim()}
pieces.forEach(p=>{const b=document.createElement("button");b.className="brick";b.dataset.id=p.id;b.textContent=vis(p.v);b.onclick=()=>{if(locked||b.disabled)return;selected.push(p);b.disabled=true;b.classList.add("used");redraw()};bank.appendChild(b)});clear.onclick=()=>{if(locked)return;selected.length=0;[...bank.children].forEach(b=>{b.disabled=false;b.classList.remove("used")});redraw()};check.onclick=()=>checkBuild(item,selected,zone,bank,check,clear)}
function checkBuild(item,selected,zone,bank,check,clear){if(locked)return;const fb=card.querySelector("#fb");if(!selected.length)return;locked=true;check.disabled=clear.disabled=true;[...bank.children].forEach(b=>b.disabled=true);const ok=norm(selected.map(x=>x.v).join(""))===norm(item.et),ans=[...zone.querySelectorAll(".brick")];if(ok){ans.forEach(b=>b.classList.add("green"));fb.className="feedback ok";fb.textContent="✓ Õige!";card.querySelector("#host").innerHTML=panel(item);good(item,1250);return}ans.forEach(b=>b.classList.add("red"));card.querySelector("#host").innerHTML=panel(item);defer(item,3800)}
function type(item){card.innerHTML=`<div class="prompt">${esc(item.ru)}</div><form class="input-row" id="form"><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="primary">Kontrolli</button></form><div class="feedback" id="fb"></div><div id="host"></div>`;const form=card.querySelector("#form"),input=card.querySelector("#answer");["paste","drop"].forEach(t=>input.addEventListener(t,e=>e.preventDefault()));input.addEventListener("beforeinput",e=>{if(["insertFromPaste","insertFromDrop","insertFromYank"].includes(e.inputType))e.preventDefault()});input.addEventListener("keydown",e=>{if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v")||(e.shiftKey&&e.key==="Insert"))e.preventDefault()});input.focus();form.onsubmit=e=>{e.preventDefault();if(locked||!input.value.trim())return;locked=true;const ok=norm(input.value)===norm(item.et);input.disabled=true;form.querySelector("button").disabled=true;if(ok){input.classList.add("correct");card.querySelector("#fb").className="feedback ok";card.querySelector("#fb").textContent="✓ Õige!";good(item,900)}else{input.classList.add("wrong");card.querySelector("#host").innerHTML=panel(item);defer(item,3500)}}}
function startReview(){mode="review";reviewQueue=shuffle(words);reviewIndex=0;reviewGood=0;reviewBad=0;reviewFlipped=false;progress.hidden=true;pill.textContent="🃏 10";restart.textContent="← Treener";renderReview()}
function renderReview(){if(reviewIndex>=reviewQueue.length)return finishReview();reviewFlipped=false;const item=reviewQueue[reviewIndex],left=reviewQueue.length-reviewIndex;counter.textContent=`${left} осталось`;pill.textContent=`🃏 ${left}`;card.innerHTML=`<div class="review-wrap"><div class="flashcard" id="flash"><div class="flashcard-inner"><div class="flash-face flash-front">${esc(item.ru)}</div><div class="flash-face flash-back"><div class="flash-back-content"><div class="flash-mnemo m${item.img}" aria-hidden="true"></div><div class="flash-word">${esc(item.et)}</div></div></div></div></div><div class="review-actions" id="reviewActions" hidden><button class="review-no" id="reviewNo">✕</button><button class="review-yes" id="reviewYes">✓</button></div><div class="review-stats"><span>✓ ${reviewGood}</span><span>✕ ${reviewBad}</span></div></div>`;const flash=card.querySelector("#flash"),actions=card.querySelector("#reviewActions");let x0=null;flash.onclick=()=>{if(reviewFlipped)return;reviewFlipped=true;flash.classList.add("flipped");actions.hidden=false};flash.addEventListener("pointerdown",e=>{x0=e.clientX});flash.addEventListener("pointerup",e=>{if(!reviewFlipped||x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>70)classifyReview(dx>0)});card.querySelector("#reviewNo").onclick=()=>classifyReview(false);card.querySelector("#reviewYes").onclick=()=>classifyReview(true)}
function classifyReview(ok){if(!reviewFlipped||locked)return;locked=true;const flash=card.querySelector("#flash"),item=reviewQueue[reviewIndex];flash.classList.add(ok?"fly-right":"fly-left");if(ok){reviewGood++;setTimeout(()=>{reviewIndex++;locked=false;renderReview()},260);return}reviewBad++;setTimeout(()=>{const [missed]=reviewQueue.splice(reviewIndex,1);const remaining=reviewQueue.length-reviewIndex;if(remaining>0){const minPos=Math.min(reviewIndex+1,reviewQueue.length);const pos=minPos+Math.floor(Math.random()*(reviewQueue.length-minPos+1));reviewQueue.splice(pos,0,missed)}else{reviewQueue.splice(reviewIndex,0,missed)}locked=false;renderReview()},260)}
function finishReview(){counter.textContent="";pill.textContent="🃏 0";card.innerHTML=`<div class="done"><div class="big">🃏</div><h2>Valmis!</h2><div class="review-stats" style="justify-content:center;margin-bottom:20px"><span>✓ ${reviewGood}</span><span>✕ ${reviewBad}</span></div><button class="primary" id="reviewAgain">Veel kord</button></div>`;card.querySelector("#reviewAgain").onclick=startReview}
function finish(){counter.textContent="";pill.textContent="Valmis";ps.forEach(p=>p.classList.add("on"));card.innerHTML='<div class="done"><div class="big">🌿</div><h2>Kõik tehtud!</h2><button class="primary" id="again">Tee veel üks ring</button></div>';card.querySelector("#again").onclick=()=>start(1)}
reviewBtn.onclick=startReview;restart.onclick=()=>mode==="review"?start(1):start(1);start(1)
})();
</script>
</body>
