  function render(){if(!active)return;if(!queue.length){finish();return}const x=queue[0];flipped=false;counter.textContent=`Осталось: ${queue.length}`;card.innerHTML=`<div class="review-wrap"><div class="tiny" style="text-align:center;margin-bottom:10px">Вопрос → ответ</div><div class="flashcard" id="qflash"><div class="flashcard-inner"><div class="flash-face">${esc(x.q)}</div><div class="flash-face flash-back">${esc(x.a)}</div></div></div><div class="review-stats"><span>✓ ${good}</span><span>✕ ${bad}</span></div><div class="review-actions" id="qactions" hidden><button class="review-no" id="qno">✕</button><button class="review-yes" id="qyes">✓</button></div><div class="tiny" style="text-align:center">Нажми на карточку, чтобы увидеть ответ</div></div>`;const f=card.querySelector('#qflash'),a=card.querySelector('#qactions');f.onclick=()=>{if(flipped)return;flipped=true;f.classList.add('flipped');a.hidden=false};card.querySelector('#qyes').onclick=()=>decide(true);card.querySelector('#qno').onclick=()=>decide(false)}
  function decide(ok){if(!queue.length)return;const x=queue.shift();if(ok){good++;render();return}bad++;if(queue.length===0){const alt=shuffle(QUESTIONS.filter(y=>y.q!==x.q))[0];if(alt)queue.push(alt)}const pos=Math.min(queue.length,Math.max(1,2+Math.floor(Math.random()*2)));queue.splice(pos,0,x);render()}
  function finish(){active=false;lock(false);counter.textContent='';pill.textContent='Готово';restart.hidden=true;if(sub)sub.textContent='Loodusõpetus · 16 карточек · 6 вопросов';card.innerHTML=`<div class="done"><div class="big">❓</div><h2>Готово!</h2><div class="finish-actions"><button class="primary" id="qagain">Ещё раз вопросы</button><button class="secondary" id="qback">К уроку</button></div></div>`;card.querySelector('#qagain').onclick=start;card.querySelector('#qback').onclick=back}
  function back(){active=false;summaryOpen=false;lock(false);restart.hidden=true;counter.textContent='';tabEt.click()}
  restart.addEventListener('click',e=>{if(!active&&!summaryOpen)return;e.preventDefault();e.stopImmediatePropagation();back()},true);
  new MutationObserver(addButtons).observe(card,{childList:true,subtree:true});addButtons();
})();
</script>
