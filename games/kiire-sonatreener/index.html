<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#2f6f58">
<meta name="application-name" content="Sõnatreener">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sõnatreener">
<meta name="mobile-web-app-capable" content="yes">
<title>Sõnatreener — EDUKASS</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="alternate icon" href="../../favicon-32.png">
<link rel="stylesheet" href="./trainer.css?v=20260909-1">
<link rel="stylesheet" href="./lesson-library.css?v=20260909-2">
<style>
.shortcut-button{font-size:20px}
.shortcut-dialog{width:min(430px,calc(100% - 28px));border:0;border-radius:22px;padding:0;box-shadow:0 24px 80px rgba(31,42,37,.28);color:#1f2a25;background:#fff}
.shortcut-dialog::backdrop{background:rgba(22,31,27,.55)}
.shortcut-dialog-inner{padding:24px}
.shortcut-dialog h2{margin:0 0 10px;color:#2f6f58;font-size:24px}
.shortcut-dialog p{margin:0;color:#56635d;line-height:1.5;font-size:15px}
.shortcut-dialog .shortcut-steps{margin:16px 0 0;padding:14px 16px;border-radius:16px;background:#eaf4ee;color:#294d3d;font-weight:700;line-height:1.5}
.shortcut-dialog .shortcut-close{width:100%;margin-top:18px;background:#2f6f58;border-color:#2f6f58;color:#fff}
</style>
</head>
<body>
<main class="app">
<div class="brand">EDUKASS</div>
<header class="top"><div><h1>Minu õppetunnid</h1><p class="sub" id="sub"></p></div><div class="top-tools"><button class="icon-button shortcut-button" id="shortcutBtn" aria-label="Добавить ярлык на главный экран" title="Добавить ярлык">📲</button><button class="icon-button deck-button" id="reviewBtn" aria-label="Карточки" title="Карточки"><span class="deck-stack" aria-hidden="true"></span></button><button class="icon-button" id="libraryBtn" aria-label="Все уроки" title="Все уроки">📚</button><div class="pill" id="pill">Eesti</div></div></header>
<div class="lang-tabs" role="tablist" aria-label="Язык тренажёра"><button class="lang-tab active" id="tabEt" role="tab">🇪🇪 Eesti</button><button class="lang-tab" id="tabDe" role="tab">🇩🇪 Deutsch</button></div>
<div class="progress" id="progress"><span id="p1" class="on"></span><span id="p2"></span><span id="p3"></span><span id="p4"></span><span id="p5"></span></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="actions"><button class="ghost" id="restart">↻ Alusta uuesti</button><div class="tiny" id="counter"></div></div>
</main>
<dialog class="shortcut-dialog" id="shortcutDialog">
  <div class="shortcut-dialog-inner">
    <h2>Добавить ярлык</h2>
    <p>Это будет обычная иконка EDUKASS на главном экране телефона, а не отдельное Android-приложение.</p>
    <div class="shortcut-steps" id="shortcutSteps"></div>
    <form method="dialog"><button class="shortcut-close" type="submit">Понятно</button></form>
  </div>
</dialog>
<script>
try{
  if(!localStorage.getItem('posterSvgReset20260909b')){
    localStorage.removeItem('sonatreenerPosterLocksV2');
    localStorage.removeItem('sonatreenerLessonLockV1');
    localStorage.setItem('posterSvgReset20260909b','1');
  }
}catch(e){}

(() => {
  const button=document.getElementById('shortcutBtn');
  const dialog=document.getElementById('shortcutDialog');
  const steps=document.getElementById('shortcutSteps');
  if(!button||!dialog||!steps)return;
  button.addEventListener('click',()=>{
    const ua=navigator.userAgent;
    const ios=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
    const samsung=/SamsungBrowser/i.test(ua);
    if(ios){
      steps.textContent='Safari: нажми «Поделиться» → «На экран Домой» → «Добавить».';
    }else if(samsung){
      steps.textContent='Samsung Internet: открой меню браузера → «Добавить страницу» / «Добавить на главный экран» и выбери обычный ярлык. Не выбирай «Установить приложение».';
    }else{
      steps.textContent='Chrome: нажми ⋮ → «Добавить на главный экран» → «Создать ярлык».';
    }
    if(typeof dialog.showModal==='function')dialog.showModal();
  });
})();
</script>
<script src="./trainer.js?v=20260909-1"></script>
<script src="./poster-fix.js?v=20260909-4"></script>
</body>
</html>
