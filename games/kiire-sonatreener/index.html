<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#2f6f58">
<meta name="application-name" content="Sõnatreener">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sõnatreener">
<title>Sõnatreener — EDUKASS</title>
<script id="edukass-smart-manifest">
window.EDUKASS_SAMSUNG_BROWSER=/SamsungBrowser/i.test(navigator.userAgent);
if(!window.EDUKASS_SAMSUNG_BROWSER){
  const manifest=document.createElement('link');
  manifest.rel='manifest';
  manifest.href='./manifest.webmanifest';
  document.head.appendChild(manifest);
}
</script>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="alternate icon" href="../../favicon-32.png">
<link rel="stylesheet" href="./trainer.css?v=20260909-1">
<link rel="stylesheet" href="./lesson-library.css?v=20260909-2">
<style>
.shortcut-button{width:auto;min-width:108px;padding:0 12px;font-size:14px;white-space:nowrap;font-weight:850;color:#2f6f58;background:#eaf4ee;border-color:#cee0d5}
.shortcut-button:disabled{opacity:.62;cursor:default}
.shortcut-button.install-focus{animation:installPulse 1s ease-in-out infinite}
@keyframes installPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(47,111,88,.18)}50%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(47,111,88,0)}}
@media(max-width:560px){.shortcut-button{min-width:100px;padding:0 10px;font-size:13px}}
</style>
</head>
<body>
<main class="app">
<div class="brand">EDUKASS</div>
<header class="top"><div><h1>Minu õppetunnid</h1><p class="sub" id="sub"></p></div><div class="top-tools"><button class="icon-button shortcut-button" id="shortcutBtn" aria-label="Добавить на главный экран" title="Добавить на главный экран">📲 На экран</button><button class="icon-button deck-button" id="reviewBtn" aria-label="Карточки" title="Карточки"><span class="deck-stack" aria-hidden="true"></span></button><button class="icon-button" id="libraryBtn" aria-label="Все уроки" title="Все уроки">📚</button><div class="pill" id="pill">Eesti</div></div></header>
<div class="lang-tabs" role="tablist" aria-label="Язык тренажёра"><button class="lang-tab active" id="tabEt" role="tab">🇪🇪 Eesti</button><button class="lang-tab" id="tabDe" role="tab">🇩🇪 Deutsch</button></div>
<div class="progress" id="progress"><span id="p1" class="on"></span><span id="p2"></span><span id="p3"></span><span id="p4"></span><span id="p5"></span></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="actions"><button class="ghost" id="restart">↻ Alusta uuesti</button><div class="tiny" id="counter"></div></div>
</main>
<script>
try{
  if(!localStorage.getItem('posterSvgReset20260909b')){
    localStorage.removeItem('sonatreenerPosterLocksV2');
    localStorage.removeItem('sonatreenerLessonLockV1');
    localStorage.setItem('posterSvgReset20260909b','1');
  }
}catch(e){}

(() => {
  const button=document.getElementById('shortcutBtn');
  if(!button)return;

  const ua=navigator.userAgent;
  const samsung=window.EDUKASS_SAMSUNG_BROWSER===true;
  const ios=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  const android=/Android/i.test(ua);
  const fromSamsung=new URLSearchParams(location.search).get('install')==='1';
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  let installEvent=null;

  function markInstalled(){
    button.textContent='✓ Готово';
    button.disabled=true;
    button.classList.remove('install-focus');
  }

  if(standalone){
    markInstalled();
    return;
  }

  if(samsung){
    button.addEventListener('click',()=>{
      const params=new URLSearchParams(location.search);
      params.set('install','1');
      const query=params.toString();
      const suffix=`${query?`?${query}`:''}${location.hash}`;
      const targetHref=`${location.origin}${location.pathname}${suffix}`;
      const intentPath=`${location.host}${location.pathname}${suffix}`;
      location.href=`intent://${intentPath}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(targetHref)};end`;
    });
    return;
  }

  if(ios){
    button.addEventListener('click',()=>{
      alert('Нажми «Поделиться» → «На экран Домой» → «Добавить».');
    });
    return;
  }

  if(!android){
    button.hidden=true;
    return;
  }

  button.disabled=true;
  button.textContent='⏳ Подготовка…';

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    installEvent=event;
    button.disabled=false;
    button.textContent=fromSamsung?'📲 Нажми сюда':'📲 На экран';
    button.classList.toggle('install-focus',fromSamsung);
  });

  window.addEventListener('appinstalled',markInstalled);

  button.addEventListener('click',async()=>{
    if(!installEvent)return;
    const event=installEvent;
    installEvent=null;
    button.disabled=true;
    button.classList.remove('install-focus');
    event.prompt();
    try{
      const choice=await event.userChoice;
      if(choice.outcome==='accepted'){
        markInstalled();
      }else{
        button.disabled=false;
        button.textContent='📲 На экран';
      }
    }catch(e){
      button.disabled=false;
      button.textContent='📲 На экран';
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{});
  }
})();
</script>
<script src="./trainer.js?v=20260909-1"></script>
<script src="./poster-fix.js?v=20260909-6"></script>
</body>
</html>
