<head>
<meta charset="utf-8">

<meta http-equiv="Cache-Control" content="no-store">
<title>Обновление Sõnatreener</title>
<style>body{font-family:system-ui,sans-serif;background:#fbfaf5;color:#234034;display:grid;place-items:center;min-height:90vh;margin:0;padding:22px;text-align:center}main{max-width:400px}a{display:inline-block;margin-top:16px;background:#2f6f58;color:white;border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:700}</style>
</head>
<body><main><h1>Sõnatreener</h1><p>Открываем обновлённый тренажёр…</p><a href="./index.html?v=20261106-5">Открыть тренажёр</a></main>
<script>
(async()=>{
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      const appScope = new URL('./',location.href).href;
      await Promise.all(registrations.filter(r=>r.scope===appScope).map(r=>r.unregister()));
    }
  } catch (_) {}
  location.replace('./index.html?v=20261106-5');
})();
</script></body></html>
