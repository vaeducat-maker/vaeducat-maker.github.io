  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:clamp(22px,7vw,42px);
  font-weight:1000;
  color:#fff;
  background:#22c968;
  box-shadow:0 4px 0 rgba(12,117,59,.35),0 0 0 4px #fff;
  z-index:2;
}
.pause-hit{
  position:absolute;
  left:3%;
  top:2%;
  width:15%;
  aspect-ratio:1;
  border:0;
  background:transparent;
  border-radius:24%;
  cursor:pointer;
}
.pause{
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(13,55,92,.48);
  backdrop-filter:blur(3px);
  z-index:20;
}
.pause.open{display:grid}
.panel{
  width:74%;
  padding:24px 18px 18px;
  border-radius:28px;
  border:4px solid #fff;
  background:linear-gradient(#e9fbff,#bdefff);
  box-shadow:0 9px 0 #2f89b8,0 20px 40px rgba(0,44,83,.28);
  text-align:center;
  color:#0d5790;
}
.panel h2{margin:0 0 18px;font-size:clamp(28px,8vw,42px)}
.panel button{
  width:100%;
  margin:7px 0;
  border:0;
  border-radius:18px;
  padding:14px 12px;
  font:900 clamp(17px,5vw,24px)/1 system-ui,sans-serif;
  color:#fff;
  background:linear-gradient(#7edb7d,#32ad55);
  box-shadow:0 5px 0 #1d7d3c;
}
.panel button.secondary{background:linear-gradient(#a58bff,#7547d6);box-shadow:0 5px 0 #5632a6}
.note{
  position:absolute;
  left:50%;
  bottom:1.1%;
  transform:translateX(-50%);
  padding:3px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:800;
  color:rgba(10,60,95,.46);
  background:rgba(255,255,255,.42);
  pointer-events:none;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="game" id="game" aria-label="LUMESADU visuaalne V2 prototüüp">
  <button class="pause-hit" id="pauseBtn" aria-label="Paus"></button>

  <button class="hit" data-i="0" aria-label="Uisud"></button>
  <button class="hit" data-i="1" aria-label="Kelk"></button>
  <button class="hit" data-i="2" aria-label="Sall"></button>
  <button class="hit" data-i="3" aria-label="Lumememm"></button>

  <section class="pause" id="pause" aria-hidden="true">
    <div class="panel">
      <h2>Paus</h2>
      <button id="continueBtn">Jätka</button>
      <button class="secondary" id="restartBtn">Alusta uuesti</button>
    </div>
  </section>
  <div class="note">V2 KELK</div>
</main>
<script>
(() => {
  const correct=1;
  const buttons=[...document.querySelectorAll('.hit')];
  let locked=false;
  function clear(){buttons.forEach(b=>b.classList.remove('red','green'))}
  buttons.forEach((b,i)=>b.addEventListener('click',()=>{
    if(locked)return;
    locked=true;
    clear();
    if(i===correct){
      b.classList.add('green');
      setTimeout(()=>{clear();locked=false},900);
      return;
    }
    b.classList.add('red');
    setTimeout(()=>{
      b.classList.remove('red');
      buttons[correct].classList.add('green');
      setTimeout(()=>{clear();locked=false},850);
    },430);
  }));

  const pause=document.getElementById('pause');
  const setPause=v=>{
    pause.classList.toggle('open',v);
    pause.setAttribute('aria-hidden',String(!v));
  };
  document.getElementById('pauseBtn').addEventListener('click',()=>setPause(true));
  document.getElementById('continueBtn').addEventListener('click',()=>setPause(false));
  document.getElementById('restartBtn').addEventListener('click',()=>{clear();locked=false;setPause(false)});
})();
</script>
</body>
</html>
