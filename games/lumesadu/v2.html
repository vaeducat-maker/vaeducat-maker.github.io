<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>LUMESADU V2 — KELK</title>
<style>
:root{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfeeff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}
.game{
  position:relative;
  width:min(100vw,56.6dvh);
  height:min(100dvh,176.7vw);
  max-width:100vw;
  max-height:100dvh;
  overflow:hidden;
  background-image:url("./assets/v2-attention.webp");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
  touch-action:manipulation;
}
.hit{
  position:absolute;
  bottom:8.1%;
  height:20.2%;
  width:22.5%;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  border-radius:10%;
  cursor:pointer;
}
.hit:focus-visible{outline:4px solid #fff;outline-offset:-6px}
.hit[data-i="0"]{left:1.6%}
.hit[data-i="1"]{left:26.0%}
.hit[data-i="2"]{left:50.5%}
.hit[data-i="3"]{left:75.0%}
.hit::after{
  content:"";
  position:absolute;
  inset:1.5%;
  border-radius:12%;
  border:7px solid transparent;
  box-shadow:none;
  opacity:0;
  transition:opacity .12s ease;
  pointer-events:none;
}
.hit.red::after{
  opacity:1;
  border-color:#ef3e4a;
  box-shadow:0 0 0 5px rgba(255,255,255,.9) inset,0 0 22px rgba(239,62,74,.75);
}
.hit.green::after{
  opacity:1;
  border-color:#22d86f;
  box-shadow:0 0 0 5px rgba(255,255,255,.9) inset,0 0 26px rgba(34,216,111,.9);
}
.hit.green::before{
  content:"✓";
  position:absolute;
  right:8%;
  top:7%;
  width:30%;
  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:clamp(22px,7vw,42px);
  font-weight:1000;
  color:#fff;
  background:#22c968;
  box-shadow:0 4px 0 rgba(12,117,59,.35),0 0 0 4px #fff;
  z-index:2;
}
.pause-hit{
  position:absolute;
  left:2.2%;
  top:1.5%;
  width:15.5%;
  aspect-ratio:1;
  border:0;
  background:transparent;
  border-radius:24%;
  cursor:pointer;
}
.pause{
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(13,55,92,.48);
  backdrop-filter:blur(3px);
  z-index:20;
}
.pause.open{display:grid}
.panel{
  width:74%;
  padding:24px 18px 18px;
  border-radius:28px;
  border:4px solid #fff;
  background:linear-gradient(#e9fbff,#bdefff);
  box-shadow:0 9px 0 #2f89b8,0 20px 40px rgba(0,44,83,.28);
  text-align:center;
  color:#0d5790;
}
.panel h2{margin:0 0 18px;font-size:clamp(28px,8vw,42px)}
.panel button{
  width:100%;
  margin:7px 0;
  border:0;
  border-radius:18px;
  padding:14px 12px;
  font:900 clamp(17px,5vw,24px)/1 system-ui,sans-serif;
  color:#fff;
  background:linear-gradient(#7edb7d,#32ad55);
  box-shadow:0 5px 0 #1d7d3c;
}
.panel button.secondary{background:linear-gradient(#a58bff,#7547d6);box-shadow:0 5px 0 #5632a6}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Child-attention pass: calmer right side, clearer status, stronger answer art */
.game{--scene:none}
.calm-right{
  position:absolute;
  right:0;
  top:30.5%;
  width:31%;
  height:34%;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 25% 85%,rgba(255,255,255,.68) 0 22%,transparent 23%),
    linear-gradient(180deg,rgba(132,211,241,.96),rgba(174,229,247,.96) 48%,rgba(137,202,230,.98));
  box-shadow:inset 18px 0 28px rgba(87,169,205,.18);
}
.calm-right::before,
.calm-right::after{
  content:"";
  position:absolute;
  bottom:5%;
  width:46%;
  height:70%;
  background:linear-gradient(180deg,#2d879c,#176979);
  clip-path:polygon(50% 0,65% 23%,59% 23%,76% 49%,67% 49%,88% 78%,12% 78%,33% 49%,24% 49%,41% 23%,35% 23%);
  opacity:.62;
  filter:saturate(.8);
}
.calm-right::before{left:5%;transform:scale(.82);transform-origin:bottom}
.calm-right::after{right:-8%;bottom:1%;opacity:.48}

.rahulik-live{
  position:absolute;
  right:3.4%;
  top:14.8%;
  z-index:8;
  min-width:29%;
  height:6.5%;
  padding:0 4.2%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6%;
  border-radius:999px;
  border:3px solid rgba(255,255,255,.92);
  background:linear-gradient(180deg,#efffff 0%,#bcf5ef 60%,#8ce2dc 100%);
  box-shadow:0 5px 0 #41a9bd,0 9px 18px rgba(28,115,154,.22),inset 0 3px 0 rgba(255,255,255,.88);
  color:#13558b;
  font-weight:1000;
  font-size:clamp(17px,4.7vw,27px);
  letter-spacing:-.02em;
  white-space:nowrap;
}
.rahulik-live .leaf{
  width:23%;
  aspect-ratio:1.35;
  flex:none;
  border-radius:100% 0 100% 0;
  transform:rotate(-28deg);
  background:linear-gradient(135deg,#55d15f,#14983c);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 rgba(24,120,56,.28);
  position:relative;
}
.rahulik-live .leaf::after{
  content:"";
  position:absolute;
  left:18%;
  right:12%;
  top:52%;
  height:2px;
  background:rgba(18,119,52,.72);
  transform:rotate(-28deg);
  transform-origin:left;
}

.hit{z-index:9}
.hit .art-zoom{
  position:absolute;
  left:12%;
  right:12%;
  top:17%;
  bottom:14%;
  border-radius:18%;
  background-image:var(--scene);
  background-repeat:no-repeat;
  background-size:575% auto;
  filter:saturate(1.05) contrast(1.02);
  pointer-events:none;
}
.hit[data-i="0"] .art-zoom{background-position:0% 96%}
.hit[data-i="1"] .art-zoom{background-position:33% 96%}
.hit[data-i="2"] .art-zoom{background-position:67% 96%}
.hit[data-i="3"] .art-zoom{background-position:100% 96%}

.hit::after{z-index:3}
.hit.green::before{z-index:4}

@media(max-width:390px){
  .rahulik-live{right:2.7%;min-width:30.5%;font-size:17px}
  .hit .art-zoom{left:10%;right:10%;top:15%;bottom:12%}
}

</style>
<meta id="attention-fix-note" name="description" content="LUMESADU V2 — simplified child-attention visual prototype">
</head>
<body>
<main class="game" id="game" aria-label="LUMESADU visuaalne V2 prototüüp">
  <button class="pause-hit" id="pauseBtn" aria-label="Paus"></button>
  <div class="calm-right" aria-hidden="true"></div>
  <div class="rahulik-live" aria-hidden="true"><span class="leaf"></span><span>Rahulik</span></div>

  <button class="hit" data-i="0" aria-label="Uisud"><span class="art-zoom" aria-hidden="true"></span></button>
  <button class="hit" data-i="1" aria-label="Kelk"><span class="art-zoom" aria-hidden="true"></span></button>
  <button class="hit" data-i="2" aria-label="Sall"><span class="art-zoom" aria-hidden="true"></span></button>
  <button class="hit" data-i="3" aria-label="Lumememm"><span class="art-zoom" aria-hidden="true"></span></button>

  <section class="pause" id="pause" aria-hidden="true">
    <div class="panel">
      <h2>Paus</h2>
      <button id="continueBtn">Jätka</button>
      <button class="secondary" id="restartBtn">Alusta uuesti</button>
    </div>
  </section>
</main>
<script>
(() => {
  const game=document.getElementById('game');
  const scene=getComputedStyle(game).backgroundImage;
  game.style.setProperty('--scene', scene);
  const correct=1;
  const buttons=[...document.querySelectorAll('.hit')];
  let locked=false;
  function clear(){buttons.forEach(b=>b.classList.remove('red','green'))}
  buttons.forEach((b,i)=>b.addEventListener('click',()=>{
    if(locked)return;
    locked=true;
    clear();
    if(i===correct){
      b.classList.add('green');
      setTimeout(()=>{clear();locked=false},900);
      return;
    }
    b.classList.add('red');
    setTimeout(()=>{
      b.classList.remove('red');
      buttons[correct].classList.add('green');
      setTimeout(()=>{clear();locked=false},850);
    },430);
  }));

  const pause=document.getElementById('pause');
  const setPause=v=>{
    pause.classList.toggle('open',v);
    pause.setAttribute('aria-hidden',String(!v));
  };
  document.getElementById('pauseBtn').addEventListener('click',()=>setPause(true));
  document.getElementById('continueBtn').addEventListener('click',()=>setPause(false));
  document.getElementById('restartBtn').addEventListener('click',()=>{clear();locked=false;setPause(false)});
})();
</script>
</body>
</html>
