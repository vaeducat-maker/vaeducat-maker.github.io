<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0752b8">
  <meta name="description" content="Neli lõbusat hommikulugu. Loe telefonis, vali vastused ja kontrolli neid. EDUKASS.">
  <title>Hommikulood · EDUKASS</title>
  <link rel="icon" type="image/png" href="assets/kiisu.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Liigu sisu juurde</a>
  <header class="topbar"><div class="top-inner">
    <button class="brand" data-action="home" aria-label="EDUKASS: kõik lood"><img src="assets/kiisu.png" width="28" height="34" alt=""><span>EDUKASS</span></button>
    <button id="all-words-button" class="secondary words-button" data-action="words" data-scope="all" aria-haspopup="dialog" aria-controls="words-dialog" aria-label="Pildisõnastik: kõik lood">Pildisõnastik</button>
  </div></header>
  <main id="main" tabindex="-1"></main>
  <div id="bottom"></div>
  <dialog id="text-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><h2 id="dialog-title">Lugu</h2><button class="icon-button" data-action="close" aria-label="Sulge tekst">✕</button></div><div id="dialog-body"></div><button class="primary wide" data-action="close">Tagasi küsimuse juurde</button></dialog>
  <dialog id="words-dialog" aria-labelledby="words-title" aria-describedby="words-story">
    <div class="words-top"><div><p id="words-story"></p><h2 id="words-title">Pildisõnastik</h2></div><button class="icon-button" data-action="words-close" aria-label="Sulge pildisõnastik" autofocus>✕</button></div>
    <p class="words-hint">Vaata pilti. Loe sõna ja näidet loost.</p>
    <div class="words-controls">
      <label for="words-search" class="sr-only">Otsi pildisõnastikust</label>
      <input id="words-search" type="search" placeholder="Otsi sõna…" autocomplete="off" spellcheck="false">
      <div class="word-filters" role="group" aria-label="Sõnade rühmad">
        <button type="button" data-word-filter="all" aria-pressed="true">Kõik</button>
        <button type="button" data-word-filter="things" aria-pressed="false">Kes? Mis?</button>
        <button type="button" data-word-filter="actions" aria-pressed="false">Tegevused</button>
        <button type="button" data-word-filter="qualities" aria-pressed="false">Milline? Kuidas?</button>
      </div>
      <p id="words-count" role="status" aria-live="polite"></p>
    </div>
    <div id="words-grid" class="words-grid"></div>
    <button id="words-return" class="primary wide" data-action="words-close">Tagasi loo juurde</button>
  </dialog>
  <div id="live" role="status" aria-live="polite" class="sr-only"></div>
  <noscript><p class="noscript">Lugude ja küsimuste avamiseks lülita brauseris JavaScript sisse.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
