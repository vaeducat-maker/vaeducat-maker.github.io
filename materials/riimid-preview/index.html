<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riimikaardid — EDUKASS</title>
<meta name="description" content="18 lõbusat eesti keele riimikaarti. Libista kaarte telefonis vasakule ja paremale.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<link rel="canonical" href="https://edukass.ee/materials/riimid-preview/">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f6f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#23352e}.deck{display:flex;width:100vw;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x pinch-zoom}.deck::-webkit-scrollbar{display:none}.slide{position:relative;flex:0 0 100vw;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;padding:max(44px,env(safe-area-inset-top)) 10px max(54px,env(safe-area-inset-bottom))}.card{width:min(94vw,78dvh,700px);aspect-ratio:1/1;background-repeat:no-repeat;background-color:#fff;border-radius:18px;box-shadow:0 5px 24px rgba(20,35,28,.12);overflow:hidden}.top,.count,.hint{position:fixed;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 12px rgba(0,0,0,.08);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);white-space:nowrap}.top{top:max(8px,env(safe-area-inset-top));padding:7px 13px;border-radius:999px;font-size:13px;font-weight:750}.count{bottom:max(9px,env(safe-area-inset-bottom));padding:8px 14px;border-radius:999px;font-size:14px;font-weight:800}.hint{bottom:calc(max(9px,env(safe-area-inset-bottom)) + 44px);padding:6px 10px;border-radius:10px;font-size:12px;color:#65716c;transition:opacity .35s ease}.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#f7f6f2;font-weight:700;color:#52625b;transition:opacity .2s ease}.loading.hide{opacity:0;pointer-events:none}@media (orientation:landscape){.card{width:min(76vh,70vw,700px)}.slide{padding-top:40px;padding-bottom:48px}}
</style>
</head>
<body>
<div class="loading" id="loading">Laen kaarte…</div>
<div class="top">EDUKASS · Riimikaardid</div>
<main class="deck" id="deck" aria-label="Riimikaardid"></main>
<div class="hint" id="hint">svaibi ↔</div>
<div class="count" id="count" aria-live="polite">1 / 18</div>
<script>
(()=>{
const titles=['kass – tass','kurk – purk','vann – kann','mesi – vesi','vaas – kaas','puur – juur','piim – liim','kook – jook','tool – kool','päike – äike','pott – kott','konn – onn','sokk – kokk','lill – pill','sall – pall','kamm – tamm','kuu – puu','lammas – hammas'];
const deck=document.getElementById('deck'),count=document.getElementById('count'),hint=document.getElementById('hint'),loading=document.getElementById('loading');
const pos=[['0%','0%'],['100%','0%'],['0%','50%'],['100%','50%'],['0%','100%'],['100%','100%']];
async function loadSheet(n){const r=await fetch(`hq/sheet-${n}.b64?v=1`,{cache:'force-cache'});if(!r.ok)throw new Error(`sheet ${n}`);return 'data:image/webp;base64,'+(await r.text()).trim()}
Promise.all([1,2,3].map(loadSheet)).then(sheets=>{
 titles.forEach((title,i)=>{const slide=document.createElement('section');slide.className='slide';slide.setAttribute('aria-label',`${i+1} / 18 · ${title}`);const card=document.createElement('div');card.className='card';card.setAttribute('role','img');card.setAttribute('aria-label',`Riimikaart: ${title}`);card.style.backgroundImage=`url("${sheets[Math.floor(i/6)]}")`;card.style.backgroundSize='200% 300%';const p=pos[i%6];card.style.backgroundPosition=`${p[0]} ${p[1]}`;slide.appendChild(card);deck.appendChild(slide)});
 requestAnimationFrame(()=>loading.classList.add('hide'));
}).catch(()=>{loading.textContent='Kaartide laadimine ebaõnnestus. Värskenda lehte.'});
let idx=0,raf=0;function update(){idx=Math.max(0,Math.min(17,Math.round(deck.scrollLeft/deck.clientWidth)));count.textContent=`${idx+1} / 18`;if(idx>0)hint.style.opacity='0';raf=0}deck.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(update)},{passive:true});window.addEventListener('resize',update);document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const n=Math.max(0,Math.min(17,idx+(e.key==='ArrowRight'?1:-1)));deck.scrollTo({left:n*deck.clientWidth,behavior:'smooth'})});setTimeout(()=>hint.style.opacity='0',3500);
})();
</script>
</body>
</html>
