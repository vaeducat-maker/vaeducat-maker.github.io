function render(){

  img.alt='Riimikaart: '+c.title;

function changeCard(dir){
  i=(i+dir+cards.length)%cards.length;
  render();
}

wrap.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  dragging=true; pointerId=e.pointerId;
  startX=e.clientX; startY=e.clientY; dx=0; dy=0;
  wrap.setPointerCapture?.(e.pointerId);
  img.style.transition='none';
});

wrap.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==pointerId)return;
  dx=e.clientX-startX; dy=e.clientY-startY;
  if(Math.abs(dx)>Math.abs(dy)){
    img.style.transform=`translateX(${dx}px) rotate(${dx/45}deg)`;
    img.style.opacity=String(Math.max(.55,1-Math.abs(dx)/500));
  }
});

function finishDrag(e){
  if(!dragging||e.pointerId!==pointerId)return;
  dragging=false;
  wrap.releasePointerCapture?.(e.pointerId);
  const horizontal=Math.abs(dx)>Math.abs(dy)*1.1;
  const passed=horizontal&&Math.abs(dx)>=55;

  img.style.transition='transform .18s ease,opacity .18s ease';

  if(passed){
    const dir=dx<0?1:-1;
    const out=dx<0?-window.innerWidth:window.innerWidth;
    img.style.transform=`translateX(${out}px) rotate(${dx<0?-8:8}deg)`;
    img.style.opacity='0';
    setTimeout(()=>changeCard(dir),180);
  } else {
    img.style.transform='translateX(0)';
    img.style.opacity='1';
  }
}

wrap.addEventListener('pointerup',finishDrag);
wrap.addEventListener('pointercancel',e=>{
  if(!dragging)return;
  dragging=false;
  img.style.transition='transform .18s ease,opacity .18s ease';
  img.style.transform='translateX(0)';
  img.style.opacity='1';
});

// Buttons remain as a fallback, but tapping the card itself does nothing.
document.getElementById('prev').onclick=()=>changeCard(-1);
document.getElementById('next').onclick=()=>changeCard(1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')changeCard(-1);
  if(e.key==='ArrowRight')changeCard(1);
});
setTimeout(()=>hint.style.opacity='0',3500);
