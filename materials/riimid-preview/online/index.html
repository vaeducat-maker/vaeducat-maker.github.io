(()=>{const names=['kass – tass','kurk – purk','vann – kann','mesi – vesi','vaas – kaas','puur – juur','piim – liim','kook – jook','tool – kool','päike – äike','pott – kott','konn – onn','sokk – kokk','lill – pill','sall – pall','kamm – tamm','kuu – puu','lammas – hammas'];const pos=[];for(let n=0;n<18;n++){const col=n%6,row=Math.floor(n/6);pos.push([col*20,row*50])}const viewport=document.getElementById('viewport'),mover=document.getElementById('mover'),count=document.getElementById('count'),hint=document.getElementById('hint');mover.style.backgroundImage=`url(data:image/avif;base64,${window.RIIMID_SPRITE||''})`;let i=0,startX=0,startY=0,dx=0,dy=0,dragging=false,pid=null;function render(){const p=pos[i];mover.style.transition='none';mover.style.transform='translateX(0)';mover.style.opacity='1';mover.style.backgroundPosition=`${p[0]}% ${p[1]}%`;viewport.setAttribute('aria-label','Riimikaart: '+names[i]);count.textContent=`${i+1} / 18`;requestAnimationFrame(()=>mover.style.transition='transform .18s ease,opacity .18s ease');if(i>0)hint.style.opacity='0'}function go(d){i=(i+d+18)%18;render()}viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;pid=e.pointerId;startX=e.clientX;startY=e.clientY;dx=dy=0;viewport.setPointerCapture?.(pid);mover.style.transition='none'});viewport.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pid)return;dx=e.clientX-startX;dy=e.clientY-startY;if(Math.abs(dx)>Math.abs(dy)){mover.style.transform=`translateX(${dx}px) rotate(${dx/45}deg)`;mover.style.opacity=String(Math.max(.55,1-Math.abs(dx)/500))}});function finish(e){if(!dragging||e.pointerId!==pid)return;dragging=false;const passed=Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.1;mover.style.transition='transform .18s ease,opacity .18s ease';if(passed){const dir=dx<0?1:-1;const out=dx<0?-window.innerWidth:window.innerWidth;mover.style.transform=`translateX(${out}px) rotate(${dx<0?-8:8}deg)`;mover.style.opacity='0';setTimeou
