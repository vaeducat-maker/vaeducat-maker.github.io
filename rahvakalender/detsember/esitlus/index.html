function endIntro(){clearTimeout(timer);$('intro').hidden=true;$('intro').classList.remove('paused');paused=false;show(0);$('next').focus({preventScroll:true})}function schedule(){start=performance.now();timer=setTimeout(endIntro,remaining)}function intro(){clearTimeout(timer);remaining=12000;paused=false;$('pause').textContent='Ⅱ Paus';const it=$('intro');it.classList.remove('paused');it.hidden=true;void it.offsetWidth;it.hidden=false;schedule()}$('banner').src=IMAGES.header;$('bird').src=IMAGES.bird;$('bg').style.backgroundImage='url('+IMAGES.header+')';for(let j=0;j<52;j++){let f=el('i','flake'),sz=2+Math.random()*5;f.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dur:${5+Math.random()*7}s;--delay:-${Math.random()*10}s;--drift:${-40+Math.random()*80}px`;$('snow').append(f)}$('skip').onclick=endIntro;$('again').onclick=intro;$('pause').onclick=()=>{if(!paused){clearTimeout(timer);remaining=Math.max(0,remaining-(performance.now()-start));$('intro').classList.add('paused');$('pause').textContent='▶ Jätka';paused=true}else{$('intro').classList.remove('paused');$('pause').textContent='Ⅱ Paus';paused=false;schedule()}};$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current===SLIDES.length-1?0:current+1);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('Täisekraan ei ole selles brauseris saadaval.')}catch{alert('Täisekraan ei ole selles brauseris saadaval.')}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'⛶ Välju':'⛶ Täisekraan'});$('close').onclick=()=>$('zoom').close();$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};document.addEventListener('keydown',e=>{if($('zoom').open)return;if(!$('intro').hidden){if(e.key==='Escape')endIntro();return}if(e.key==='ArrowRight'){e.preventDefault();show(Math.min(SLIDES.length-1,current+1))}if(e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,current-1))}});show(0);if(reduced){$('intro').hidden=true}else intro();</script></body></html>
