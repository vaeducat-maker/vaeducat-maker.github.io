name: Deploy EDUKASS preview to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Include trainer back navigation in Cloudflare build
        run: |
          if ! grep -q "games/kiire-sonatreener/back-nav.js" scripts/build-cloudflare-site.js; then
            sed -i "/games\/kiire-sonatreener\/icon.svg/a\\  'games/kiire-sonatreener/back-nav.js'," scripts/build-cloudflare-site.js
          fi

      - name: Make Sõnatreener manifest Cloudflare-build compatible
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'games/kiire-sonatreener/index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('edukass-smart-manifest')) {
            html = html.replace(
              '<link rel="manifest" href="./manifest.webmanifest">',
              `<script id="edukass-smart-manifest">\nif(!/SamsungBrowser/i.test(navigator.userAgent)){\n  const manifest=document.createElement('link');\n  manifest.rel='manifest';\n  manifest.href='./manifest.webmanifest';\n  document.head.appendChild(manifest);\n}\n</script>`
            );
            fs.writeFileSync(file, html, 'utf8');
          }
          NODE

      - name: Build public EDUKASS site
        run: node scripts/build-cloudflare-site.js

      - name: Deploy edukass-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
