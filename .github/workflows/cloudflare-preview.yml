# manual redeploy trigger: stolbiki training theme 2026-10-21
name: Deploy EDUKASS preview to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Publication is blocked until the independent quality workflow
  # has returned SUCCESS for the exact commit SHA being deployed.
  # Avoid a second redundant browser installation.
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful independent EDUKASS acceptance for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality-gate.yml/runs?head_sha=$GITHUB_SHA&per_page=10" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'" and .event == "push")][0] | if . == null then "pending" elif .status != "completed" then "pending" else .conclusion end')"
            echo "Independent EDUKASS quality audit for $GITHUB_SHA: $state (check $attempt/75)"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" != pending ] && [ "$state" != in_progress ]; then
              echo "::error::Independent quality audit for this exact commit did not pass: $state"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out awaiting successful independent quality audit for this commit"
          exit 1
  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Include trainer back navigation in Cloudflare build
        run: |
          if ! grep -q "games/kiire-sonatreener/back-nav.js" scripts/build-cloudflare-site.js; then
            sed -i "/games\/kiire-sonatreener\/icon.svg/a\\  'games/kiire-sonatreener/back-nav.js'," scripts/build-cloudflare-site.js
          fi

      - name: Include hidden September word game in Cloudflare build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/build-cloudflare-site.js';
          let source = fs.readFileSync(file, 'utf8');
          const game = "  'games/septembri-sonamang/index.html'";
          if (!source.includes(game)) {
            const anchor = "  'games/minu-suvi/index.html'";
            if (!source.includes(anchor)) throw new Error('Minu suvi Cloudflare build anchor not found');
            source = source.replace(anchor, `${anchor},\n${game}`);
            fs.writeFileSync(file, source, 'utf8');
          }
          NODE

      - name: Make Sõnatreener manifest Cloudflare-build compatible
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'games/kiire-sonatreener/index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('edukass-smart-manifest')) {
            html = html.replace(
              '<link rel="manifest" href="./manifest.webmanifest">',
              `<script id="edukass-smart-manifest">\nif(!/SamsungBrowser/i.test(navigator.userAgent)){\n  const manifest=document.createElement('link');\n  manifest.rel='manifest';\n  manifest.href='./manifest.webmanifest';\n  document.head.appendChild(manifest);\n}\n</script>`
            );
            fs.writeFileSync(file, html, 'utf8');
          }
          NODE

      - name: Block deployment if ANY new trainer lacks learning-quality evidence
        run: node scripts/pedagogy/runner.js

      - name: Block deployment if Stolbiki pedagogical quality fails
        run: node scripts/stolbiki-pedagogy-gate.js

      - name: Check Sõnatreener architecture
        run: node scripts/check-sonatreener.js

      - name: Set up Python for social card rendering
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate Stolbiki share preview with actual world artwork
        run: |
          python -m pip install --disable-pip-version-check pillow==12.0.0
          python scripts/generate-stolbiki-social.py
          test -s assets/stolbiki-share-preview.jpg

      - name: Build public EDUKASS site
        run: node scripts/build-cloudflare-site.js

      - name: Verify committed Riimikaardid print PDFs
        run: |
          test -f materials/riimid-preview/files/EDUKASS_Riimikaardid_A4_6_kaarti.pdf
          test -f materials/riimid-preview/files/EDUKASS_Riimikaardid_A4_9_kaarti.pdf

      - name: Include Riimikaardid material
        run: |
          mkdir -p dist/materials/riimid-preview
          cp materials/riimid-preview/index.html dist/materials/riimid-preview/index.html
          cp materials/riimid-preview/cards-*.js dist/materials/riimid-preview/
          cp -R materials/riimid-preview/online dist/materials/riimid-preview/online
          cp -R materials/riimid-preview/files dist/materials/riimid-preview/files
          cp _headers dist/_headers
          node scripts/publish-riimikaardid.js

      - name: Add swipeable adjective cards
        run: node scripts/patch-sept-adj-carousel.js

      - name: Deploy edukass-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
