name: Fix Sõnatreener install icons

on:
  push:
    paths:
      - '.github/workflows/fix-sonatreener-install.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PNG app icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 games/kiire-sonatreener/icon.svg -o games/kiire-sonatreener/icon-192.png
          rsvg-convert -w 512 -h 512 games/kiire-sonatreener/icon.svg -o games/kiire-sonatreener/icon-512.png
      - name: Update manifest
        run: |
          python3 - <<'PY'
          import json
          p='games/kiire-sonatreener/manifest.webmanifest'
          with open(p,encoding='utf-8') as f: m=json.load(f)
          m['id']='/games/kiire-sonatreener/'
          m['start_url']='/games/kiire-sonatreener/'
          m['scope']='/games/kiire-sonatreener/'
          m['prefer_related_applications']=False
          m['icons']=[
            {'src':'./icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'./icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'},
            {'src':'./icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any'}
          ]
          with open(p,'w',encoding='utf-8') as f: json.dump(m,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
      - name: Commit installability fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/kiire-sonatreener/icon-192.png games/kiire-sonatreener/icon-512.png games/kiire-sonatreener/manifest.webmanifest
          git commit -m 'Fix Sõnatreener PWA install icons [skip ci]'
          git push
