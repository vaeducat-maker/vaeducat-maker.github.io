name: EDUKASS Nine-World Runner QA
on:
  push:
    branches:
      - feature/umardamine-nine-worlds-complete-20261124
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate nine worlds, crystals, keyboard and final fusion
        run: python games/umardamine/nine-worlds/tests/test_nine_worlds.py
      - name: Save screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edukass-nine-worlds-browser-screenshots
          path: games/umardamine/nine-worlds/qa_*.png
          if-no-files-found: ignore
