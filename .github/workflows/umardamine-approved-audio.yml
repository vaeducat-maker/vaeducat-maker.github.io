name: EDUKASS Approved Solar Spark Audio
on:
  push:
    branches:
      - feature/umardamine-solar-spark-share-passport-20261124
    paths:
      - games/umardamine/nine-worlds/scripts/generate_approved_audio.py
      - .github/workflows/umardamine-approved-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-approved-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/umardamine-solar-spark-share-passport-20261124
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline sound synthesis dependency
        run: python -m pip install numpy
      - name: Render approved music and loss sound
        run: python games/umardamine/nine-worlds/scripts/generate_approved_audio.py
      - name: Save generated assets in the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/umardamine/nine-worlds/assets/02_solar_spark.mp3 games/umardamine/nine-worlds/assets/01_soft_oops.mp3
          if ! git diff --staged --quiet; then
            git commit -m "Add approved Solar Spark and Soft Oops MP3 game assets [skip ci]"
            git push origin HEAD:feature/umardamine-solar-spark-share-passport-20261124
          fi
