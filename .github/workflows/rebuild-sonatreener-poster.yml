name: Rebuild Sõnatreener poster once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild real JPEG from verified text chunks
        shell: bash
        run: |
          set -euo pipefail
          OUT="games/kiire-sonatreener/poster-pretty.jpg"
          cat games/kiire-sonatreener/poster-pretty/{0,1,2,3,4,5}.txt | tr -d '\r\n' | base64 --decode > "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/kiire-sonatreener/poster-pretty.jpg')
          b=p.read_bytes()
          assert len(b) > 10000, len(b)
          assert b[:2] == b'\xff\xd8', b[:8]
          assert b[-2:] == b'\xff\xd9', b[-8:]
          print('JPEG OK:', len(b), 'bytes')
          PY

      - name: Point trainer directly at the JPEG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/kiire-sonatreener/trainer.js')
          s=p.read_text()
          s=s.replace('poster:"./poster-vesi-ja-jogi.webp"','poster:"./poster-pretty.jpg?v=20260909-1"')
          p.write_text(s)

          p=Path('games/kiire-sonatreener/poster-fix.js')
          p.write_text("// Poster is now a normal static JPEG. No runtime patching needed.\n")

          p=Path('games/kiire-sonatreener/index.html')
          s=p.read_text()
          s=s.replace('./trainer.js?v=20260909-3','./trainer.js?v=20260909-5')
          s=s.replace('./trainer.js?v=20260909-2','./trainer.js?v=20260909-5')
          s=s.replace('./trainer.js?v=20260909-1','./trainer.js?v=20260909-5')
          s=s.replace('./poster-fix.js?v=20260909-8','./poster-fix.js?v=20260909-9')
          s=s.replace('./poster-fix.js?v=20260909-7','./poster-fix.js?v=20260909-9')
          p.write_text(s)

          p=Path('games/kiire-sonatreener/service-worker.js')
          s=p.read_text()
          import re
          s=re.sub(r"const CACHE='edukass-sonatreener-v\d+';", "const CACHE='edukass-sonatreener-v6';", s)
          s=s.replace('./trainer.js?v=20260909-3','./trainer.js?v=20260909-5')
          s=s.replace('./trainer.js?v=20260909-2','./trainer.js?v=20260909-5')
          s=s.replace('./trainer.js?v=20260909-1','./trainer.js?v=20260909-5')
          s=s.replace('./poster-fix.js?v=20260909-8','./poster-fix.js?v=20260909-9')
          s=s.replace('./poster-fix.js?v=20260909-7','./poster-fix.js?v=20260909-9')
          # Add the normal JPEG to the cache list if it is not there yet.
          if "./poster-pretty.jpg?v=20260909-1" not in s:
              s=s.replace("'./icon-192.png'", "'./poster-pretty.jpg?v=20260909-1','./icon-192.png'")
          p.write_text(s)
          PY

      - name: Remove this one-time workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rebuild-sonatreener-poster.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/kiire-sonatreener .github/workflows/rebuild-sonatreener-poster.yml
          git commit -m "Use direct JPEG poster in Sõnatreener"
          git push
