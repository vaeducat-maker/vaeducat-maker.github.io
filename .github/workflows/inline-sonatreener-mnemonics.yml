name: Inline Sõnatreener mnemonic sprite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inline-sonatreener-mnemonics.yml'

permissions:
  contents: write

jobs:
  inline-sprite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed mnemonic sprite into trainer HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          html_path = Path('games/kiire-sonatreener/index.html')
          image_path = Path('games/kiire-sonatreener/mnemonics.webp')
          html = html_path.read_text(encoding='utf-8')

          external = 'url("./mnemonics.webp")'
          if external not in html:
              print('Sprite is already embedded; nothing to do.')
              raise SystemExit(0)

          data = base64.b64encode(image_path.read_bytes()).decode('ascii')
          embedded = f'url("data:image/webp;base64,{data}")'
          html = html.replace(external, embedded)
          html_path.write_text(html, encoding='utf-8')

          if './mnemonics.webp' in html:
              raise SystemExit('External sprite reference still present')
          if 'data:image/webp;base64,' not in html:
              raise SystemExit('Embedded sprite was not written')
          if not html.rstrip().endswith('</html>'):
              raise SystemExit('HTML appears truncated')
          print('Mnemonic sprite embedded successfully.')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('games/kiire-sonatreener/index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>') + len('<script>')
          end = html.rfind('</script>')
          if start < len('<script>') or end <= start:
              raise SystemExit('Inline script not found')
          Path('/tmp/sonatreener.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/sonatreener.js

      - name: Commit embedded version
        shell: bash
        run: |
          if git diff --quiet -- games/kiire-sonatreener/index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/kiire-sonatreener/index.html
          git commit -m 'Embed mnemonic illustrations in Sõnatreener HTML'
          git push
