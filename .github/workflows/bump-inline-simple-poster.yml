name: Bump inline simple poster cache
on:
  push:
    paths:
      - '.github/workflows/bump-inline-simple-poster.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump poster script version and clean workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games/kiire-sonatreener/index.html')
          s=p.read_text()
          s=s.replace('./poster-fix.js?v=20260909-10','./poster-fix.js?v=20260909-11')
          p.write_text(s)
          Path('.github/workflows/bump-inline-simple-poster.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/kiire-sonatreener/index.html .github/workflows/bump-inline-simple-poster.yml
          git commit -m "Use inline simple poster cache-bust"
          git push origin main
