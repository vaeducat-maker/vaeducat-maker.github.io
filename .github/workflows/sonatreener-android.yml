name: Build Sonatreener Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'android/sonatreener-app/**'
      - '.github/workflows/sonatreener-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        working-directory: android/sonatreener-app
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp android/sonatreener-app/app/build/outputs/apk/debug/app-debug.apk Sonatreener-Android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sonatreener-Android-test
          path: Sonatreener-Android-test.apk
          if-no-files-found: error
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sonatreener-android-test-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sonatreener-Android-test.apk --clobber
          else
            gh release create "$TAG" Sonatreener-Android-test.apk --prerelease \
              --title "Sõnatreener Android (test APK)" \
              --notes "Experimental native WebView wrapper, for checking Family Link independently of Chrome. Not yet tested on a supervised child device."
          fi
