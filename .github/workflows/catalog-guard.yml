name: EDUKASS catalog guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protect-published-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore canonical Hommikulood PDF
        run: node scripts/restore-hommikulood-pdf.js
      - name: Test guard itself
        run: node scripts/test-catalog-guard.js
      - name: Test public metadata guard
        run: node scripts/test-material-metadata.js
      - name: Validate catalog and permanent links
        run: node scripts/catalog-guard.js
      - name: Check Sõnatreener architecture
        run: node scripts/check-sonatreener.js
      - name: Set up Python for derived publication previews
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate the required Stolbiki social image before build
        run: |
          python -m pip install --disable-pip-version-check pillow==12.0.0
          python scripts/generate-stolbiki-social.py
          test -s assets/stolbiki-share-preview.jpg
      - name: Build Cloudflare site
        run: node scripts/build-cloudflare-site.js
      - name: Show release report
        if: always()
        run: cat RELEASE_REPORT_RU.md || true
