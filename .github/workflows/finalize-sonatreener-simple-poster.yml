name: Finalize Sõnatreener simple poster
on:
  push:
    paths:
      - '.github/workflows/finalize-sonatreener-simple-poster.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump poster fix and remove service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games/kiire-sonatreener/index.html')
          s=p.read_text()
          s=s.replace("./poster-fix.js?v=20260909-9","./poster-fix.js?v=20260909-10")
          block="""  if('serviceWorker' in navigator){\n    navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{});\n  }\n"""
          s=s.replace(block,"")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/kiire-sonatreener/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize simple Sõnatreener poster"
          git push origin main
